<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
  <title id="title">RunReplay — GitHub Actions job inspector</title>
  <desc id="desc">A terminal-inspired view of RunReplay extracting a commit SHA, runner labels, a failed step, and artifacts from a GitHub Actions job URL.</desc>

  <rect width="1200" height="380" rx="24" fill="#0d1117"/>
  <rect x="28" y="28" width="1144" height="324" rx="16" fill="#161b22" stroke="#30363d"/>

  <g id="title-block" transform="translate(76 82)">
    <text x="0" y="0" fill="#58a6ff" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="700" letter-spacing="2">GITHUB ACTIONS / CI INSPECTION</text>
    <text x="0" y="66" fill="#f0f6fc" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="64" font-weight="750">RunReplay</text>
    <text x="2" y="112" fill="#c9d1d9" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="25">Inspect a failed GitHub Actions job.</text>
    <text x="2" y="146" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="20">Keep the evidence before you decide how to fix it.</text>

    <g id="command" transform="translate(0 190)">
      <rect width="484" height="50" rx="9" fill="#0d1117" stroke="#30363d"/>
      <text x="18" y="32" fill="#7ee787" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">$ runreplay inspect &lt;job-url&gt;</text>
    </g>
  </g>

  <g id="inspection-proof" transform="translate(680 66)">
    <rect width="430" height="250" rx="12" fill="#0d1117" stroke="#30363d"/>
    <circle cx="28" cy="26" r="6" fill="#ff7b72"/>
    <circle cx="48" cy="26" r="6" fill="#e3b341"/>
    <circle cx="68" cy="26" r="6" fill="#7ee787"/>
    <text x="94" y="32" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">inspection record</text>
    <line x1="0" y1="50" x2="430" y2="50" stroke="#30363d"/>

    <text x="26" y="88" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">commit SHA</text>
    <text x="176" y="88" fill="#f0f6fc" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">3d3c42e5…</text>
    <text x="26" y="124" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">runner</text>
    <text x="176" y="124" fill="#f0f6fc" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">ubuntu-latest</text>
    <text x="26" y="160" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">failed step</text>
    <text x="176" y="160" fill="#ff7b72" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">Run Dependabot</text>
    <text x="26" y="196" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">artifacts</text>
    <text x="176" y="196" fill="#f0f6fc" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">0 attached</text>
    <line x1="26" y1="216" x2="404" y2="216" stroke="#30363d"/>
    <text x="26" y="239" fill="#7ee787" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">facts first · replay later</text>
  </g>
</svg>
